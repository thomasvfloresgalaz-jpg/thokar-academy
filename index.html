<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b92433"><link rel="manifest" href="/manifest.webmanifest"><title>THOKAR Academy</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;--bg:#101116;--panel:#1b1d24;--card:#252832;--line:#353944;--text:#f3f4f7;--muted:#a8acb7;--red:#d03b4c;--soft:#4b2530}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}body.light{color-scheme:light;--bg:#f4f4f6;--panel:#fff;--card:#f1f1f4;--line:#d7d8dd;--text:#17181d;--muted:#626570;--soft:#f9e6e9}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1100px;margin:auto;min-height:100dvh;padding:18px 18px 104px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:var(--red);display:grid;place-items:center;font-weight:900;font-size:22px}.brand b{letter-spacing:.07em}.small{font-size:12px;color:var(--muted)}.title{font-size:24px;font-weight:800;margin:0 0 12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:16px;margin-bottom:14px}.card{background:var(--card);border-radius:15px;padding:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--red);color:white;font-weight:700;min-height:44px}.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.block{width:100%}.btn.sm{padding:8px 10px;min-height:35px;font-size:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:10px}.muted{color:var(--muted)}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:11px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px max(8px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));z-index:20}.nav button{background:transparent;border:0;color:var(--muted);font-size:12px;display:grid;justify-items:center;gap:3px;min-width:64px}.nav button.active{color:var(--red)}.nav .ico{font-size:21px}.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--red);border-radius:99px}.label{font-size:12px;color:var(--muted);display:block;margin:0 0 5px}input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:12px;outline:0}textarea{resize:vertical;min-height:80px}.messages{display:flex;flex-direction:column;gap:9px;min-height:180px;max-height:330px;overflow-y:auto;padding:12px;background:var(--card);border-radius:13px}.bubble{padding:10px 12px;border-radius:14px;max-width:89%;line-height:1.45;white-space:pre-wrap;font-size:14px}.bubble.client{background:var(--panel);align-self:flex-start}.bubble.me{background:var(--soft);align-self:flex-end}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--muted);padding:9px 12px}.tabs button.active{background:var(--red);color:#fff;border-color:var(--red)}.item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.result{border-left:3px solid var(--red);background:var(--card);padding:12px;border-radius:8px;margin-top:8px;white-space:pre-wrap}.notice{padding:12px;background:var(--soft);border-radius:12px;line-height:1.5;font-size:13px}.viewer{height:320px;background:radial-gradient(ellipse at center,#323844 0%,#151820 80%);border-radius:15px;overflow:hidden;position:relative;touch-action:none}.viewer canvas{display:block;width:100%;height:100%}.viewer .hint{position:absolute;bottom:8px;left:10px;right:10px;color:#fff;font-size:11px;text-shadow:0 1px 4px #000;pointer-events:none}.loading{display:inline-block;width:15px;height:15px;border:2px solid #ffffff55;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:800px){.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.viewer{height:420px}.app{padding-top:30px}}@media(prefers-reduced-motion:no-preference){.panel{animation:appear .23s ease both}@keyframes appear{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}
</style></head><body><div id="root"></div><script type="module">
const $=s=>document.querySelector(s),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE='thokar-academy-state-1';const defaultState=()=>({page:'home',tab:'client',case:null,history:[],skills:{},xp:0,attempt:1,tests:[],repairs:[],messages:[],notes:'',diagnosis:'',clientDraft:'',busy:false,evaluation:null,started:0,paused:0,theme:'dark',study:null,studyTopic:'',firstAssessment:true});let S;try{S={...defaultState(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{S=defaultState()}S.busy=false;const save=()=>{try{localStorage.setItem(STORE,JSON.stringify({...S,busy:false}))}catch(e){console.warn('Guardado lleno',e)}};const set=(p)=>{Object.assign(S,p);save();render()};const e=escapeHtml;
const btn=(label,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${label}</button>`;
async function ai(task,payload){const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,payload})});let j;try{j=await r.json()}catch{throw Error('Respuesta del servidor inválida')}if(!r.ok)throw Error(j.error||'Error de conexión');return j.result}
function header(){return `<header class="top"><div class="brand"><div class="logo">T</div><div><b>THOKAR ACADEMY</b><div class="small">Diagnostica · Aprende · Domina</div></div></div><button class="btn alt sm" data-action="settings">⚙ Ajustes</button></header>`}
function nav(){return `<nav class="nav">${[['home','⌂','Inicio'],['workshop','🚘','Taller'],['study','▤','Estudiar'],['progress','▥','Progreso']].map(([p,i,l])=>`<button class="${S.page===p?'active':''}" data-page="${p}"><span class="ico">${i}</span>${l}</button>`).join('')}</nav>`}
function home(){const last=S.history.at(-1);return `<h1 class="title">Tu centro de entrenamiento</h1><div class="panel"><div class="row between"><b>${S.case?'Diagnóstico en curso':'Tu siguiente desafío'}</b><span class="pill">${S.case?e(S.case.difficulty):'IA dinámica'}</span></div><p class="muted">${S.case?`${e(S.case.vehicle.brand)} ${e(S.case.vehicle.model)} ${e(S.case.vehicle.year)} · ${e(S.case.complaint)}`:'La IA creará un cliente y un vehículo con una falla nueva, ajustada a tu progreso.'}</p>${btn(S.case?'Continuar diagnóstico':S.firstAssessment?'Comenzar evaluación inicial':'Generar nuevo diagnóstico',S.case?'workshop':'new','block')}</div><div class="grid"><div class="card"><div class="muted small">Experiencia</div><h2>${S.xp} XP</h2></div><div class="card"><div class="muted small">Casos terminados</div><h2>${S.history.length}</h2></div><div class="card" data-page="study">📖<h3>Biblioteca</h3><div class="small">Mediciones y teoría</div></div><div class="card" data-page="progress">📈<h3>Competencias</h3><div class="small">Tus evaluaciones</div></div></div>${last?`<div class="panel"><b>Última evaluación</b><p>${e(last.vehicle)} · ${last.score}/100</p></div>`:''}<div class="notice" style="margin-top:15px">Los casos generados contienen mediciones ficticias para entrenamiento. No utilices sus valores como especificaciones de reparación de vehículos reales.</div>`}
function workshop(){if(!S.case)return `<h1 class="title">Taller virtual</h1><div class="panel"><p>Aún no tienes un diagnóstico activo.</p>${btn('Generar un caso','new','block')}</div>`;const c=S.case;return `<div class="row between"><h1 class="title" style="margin:0">${e(c.vehicle.brand)} ${e(c.vehicle.model)}</h1><span class="pill">Intento ${S.attempt}/2</span></div><p class="small">${e(c.vehicle.year)} · ${e(c.vehicle.engine)} · ${e(c.difficulty)} · <span id="clock">00:00</span></p><div class="tabs">${[['client','Cliente'],['3d','Taller 3D'],['tests','Pruebas'],['repair','Reparación'],['report','Informe']].map(([id,label])=>`<button data-tab="${id}" class="${S.tab===id?'active':''}">${label}</button>`).join('')}</div>${S.tab==='client'?client(c):S.tab==='3d'?garage(c):S.tab==='tests'?tests(c):S.tab==='repair'?repair(c):report(c)}`}
function client(c){return `<div class="panel"><b>💬 ${e(c.customer.name)} · Cliente</b><p class="small">${e(c.complaint)}</p><div class="messages" id="messages">${S.messages.map(m=>`<div class="bubble ${m.role==='me'?'me':'client'}">${e(m.text)}</div>`).join('')}</div><form id="chatForm" class="row" style="margin-top:12px"><input id="chatInput" aria-label="Mensaje al cliente" placeholder="Pregúntale al cliente..." value="${e(S.clientDraft)}" maxlength="1000" required><button class="btn" ${S.busy?'disabled':''}>${S.busy?'···':'Enviar'}</button></form><p class="small">El cliente no conoce el diagnóstico oculto. Pregúntale por síntomas y antecedentes.</p></div>`}
function garage(c){return `<div class="panel"><b>Inspección del vehículo</b><p class="small">Modelo 3D procedimental genérico para practicar orientación y selección de zonas; no representa exactamente este vehículo.</p><div class="viewer" id="viewer"><div class="hint">Arrastra para rotar · Pellizca para acercar · Selecciona una zona debajo</div></div><div class="grid3" style="margin-top:10px">${[['motor','Motor'],['ruedas','Ruedas'],['interior','Interior']].map(([id,n])=>btn(n,'zone:'+id,'alt sm')).join('')}</div><div id="zoneInfo" class="result">Selecciona una zona para inspeccionarla.</div></div>`}
function tests(c){return `<div class="panel"><b>Instrumentos y pruebas</b><p class="small">Resultados del caso simulado. Puedes investigar en cualquier orden.</p>${(c.tests||[]).map(t=>`<div class="item"><div style="flex:1"><b>${e(t.label)}</b><div class="small">${e(t.category||'Diagnóstico')}</div>${S.tests.includes(t.id)?`<div class="result">${e(t.result)}</div>`:''}</div>${btn(S.tests.includes(t.id)?'Repetir':'Realizar','test:'+e(t.id),'sm alt')}</div>`).join('')}</div><div class="panel"><b>Multímetro virtual · práctica de alimentación</b><p class="small">Simulador didáctico independiente: selecciona la función correcta para medir tensión continua de una batería.</p><div class="grid"><select id="meterMode"><option value="ohm">Ω Resistencia</option><option value="vdc">V⎓ Tensión continua</option><option value="vac">V~ Tensión alterna</option></select><select id="meterProbes"><option value="wrong">Puntas invertidas / conexión incorrecta</option><option value="right">Roja a + y negra a −</option></select></div><div class="row" style="margin-top:10px">${btn('Medir','meter','sm')}<b id="meterRead">—</b></div><p class="small">Ejercicio genérico, no medición del vehículo del caso. Nunca midas resistencia en un circuito energizado.</p></div>`}
function repair(c){return `<div class="panel"><b>Intervenciones disponibles</b><p class="small">Selecciona solo las reparaciones que consideres justificadas. Algunas pueden generar gastos innecesarios.</p>${(c.repairs||[]).map(r=>`<div class="item"><div style="flex:1"><b>${e(r.label)}</b>${S.repairs.includes(r.id)?'<div class="small">Intervención realizada</div>':''}</div>${btn(S.repairs.includes(r.id)?'Realizada':'Aplicar','repair:'+e(r.id),'sm alt') }</div>`).join('')}</div>`}
function report(c){if(S.evaluation)return evaluation();return `<div class="panel"><b>Informe de diagnóstico</b><p class="small">Describe la causa que sospechas, qué evidencias la respaldan, qué reparación aplicaste y cómo verificarías el resultado. La IA evaluará tus decisiones.</p><label class="label" for="diagnosis">Tu razonamiento técnico</label><textarea id="diagnosis" placeholder="Mi hipótesis es... porque..." rows="7">${e(S.diagnosis)}</textarea><div class="row between" style="margin-top:10px"><span class="small">Pruebas: ${S.tests.length} · Intervenciones: ${S.repairs.length}</span>${btn('Finalizar y evaluar','evaluate','sm')}</div></div>`}
function evaluation(){const v=S.evaluation;return `<div class="panel"><div class="row between"><h2>Evaluación del caso</h2><span class="pill">Intento ${S.attempt}</span></div><h1 style="font-size:44px;text-align:center;color:var(--red)">${Number(v.score)||0}/100</h1><p style="text-align:center">${v.passed?'Diagnóstico satisfactorio':'Diagnóstico por reforzar'}</p>${[['Razonamiento',v.reasoning],['Pruebas',v.testing],['Seguridad',v.safety],['Comunicación',v.communication]].map(([l,n])=>`<div style="margin:10px 0"><div class="row between small"><span>${l}</span><span>${Number(n)||0}%</span></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,Number(n)||0))}%"></i></div></div>`).join('')}<div class="result">${e(v.feedback)}</div><h3>Fortalezas</h3><ul>${(v.strengths||[]).map(x=>`<li>${e(x)}</li>`).join('')}</ul><h3>Por mejorar</h3><ul>${(v.improvements||[]).map(x=>`<li>${e(x)}</li>`).join('')}</ul>${v.lesson?`<div class="notice">${e(v.lesson)}</div>`:''}${v.reveal?`<p><b>Explicación de la falla:</b> ${e(v.reveal)}</p>`:''}<div class="stack" style="margin-top:16px">${!v.passed&&S.attempt===1?btn('Intentar nuevamente sin revelar la solución','retry','block'):btn('¿Generar otro caso?','askNext','block')}${btn('Volver al inicio','home','alt block')}</div></div>`}
function study(){return `<h1 class="title">Biblioteca técnica</h1><div class="panel"><b>Aprende a medir y diagnosticar</b><p class="small">Pregunta qué medir en un componente, cómo hacerlo y cómo interpretar resultados. Para valores exactos necesitas documentación verificable del vehículo.</p><form id="studyForm" class="stack"><textarea id="studyInput" placeholder="Ej.: ¿Cómo comprobar una bobina COP con multímetro y escáner?" required>${e(S.studyTopic)}</textarea><button class="btn" ${S.busy?'disabled':''}>${S.busy?'Consultando...':'Consultar instructor IA'}</button></form></div>${S.study?`<div class="panel"><h2>${e(S.study.title)}</h2><p style="white-space:pre-wrap;line-height:1.55">${e(S.study.explanation)}</p><h3>Procedimiento</h3><ol>${(S.study.steps||[]).map(x=>`<li>${e(x)}</li>`).join('')}</ol><h3>Precauciones</h3><ul>${(S.study.cautions||[]).map(x=>`<li>${e(x)}</li>`).join('')}</ul><h3>Autoevaluación</h3>${(S.study.questions||[]).map((x,i)=>`<details class="card" style="margin:8px 0"><summary>${e(x.question)}</summary><p>${e(x.answer)}</p></details>`).join('')}</div>`:''}<div class="notice">Las explicaciones de IA pueden contener errores. Confirma procedimientos críticos y valores exactos con manuales técnicos del fabricante.</div>`}
function progress(){return `<h1 class="title">Tu progreso</h1><div class="grid"><div class="card"><div class="small">Experiencia total</div><h2>${S.xp} XP</h2></div><div class="card"><div class="small">Casos completados</div><h2>${S.history.length}</h2></div></div><div class="panel" style="margin-top:14px"><h3>Competencias estimadas</h3>${Object.entries(S.skills).length?Object.entries(S.skills).map(([k,v])=>`<div style="margin:12px 0"><div class="row between"><span>${e(k)}</span><b>${Math.round(v)}%</b></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div></div>`).join(''):'<p class="muted">Completa tu primera evaluación para comenzar.</p>'}</div><div class="panel"><h3>Historial de casos</h3>${S.history.length?S.history.slice().reverse().map(h=>`<div class="item"><div><b>${e(h.vehicle)}</b><div class="small">${e(h.date)}</div></div><b>${h.score}/100</b></div>`).join(''):'<p class="muted">Todavía no hay evaluaciones.</p>'}</div>`}
function settings(){return `<h1 class="title">Configuración</h1><div class="panel"><b>Estado de la IA</b><div id="apiStatus" class="muted" style="margin:10px 0">Comprobando conexión...</div>${btn('Comprobar conexión','health','alt sm')}<p class="small">La clave GEMINI_API_KEY se configura en las variables de entorno de Render, nunca en GitHub ni en este navegador.</p></div><div class="panel"><b>Apariencia</b><div class="row" style="margin-top:12px">${btn('Modo oscuro','dark','alt sm')}${btn('Modo claro','light','alt sm')}</div></div><div class="panel"><b>Respaldo</b><p class="small">Tu progreso se guarda automáticamente en este navegador. Borrar datos del sitio o cambiar de teléfono puede eliminarlo.</p><div class="row">${btn('Exportar progreso','export','alt sm')}<label class="btn alt sm" for="importFile">Importar progreso</label><input id="importFile" type="file" accept="application/json" style="display:none"></div></div>`}
function render(){document.body.classList.toggle('light',S.theme==='light');$('#root').innerHTML=`<div class="app">${header()}${S.page==='home'?home():S.page==='workshop'?workshop():S.page==='study'?study():S.page==='progress'?progress():settings()}</div>${nav()}`;if(S.page==='workshop'&&S.tab==='3d')init3d();if(S.page==='settings')health();if($('#messages'))$('#messages').scrollTop=$('#messages').scrollHeight}
async function busyTask(action,fn){if(S.busy)return;S.busy=true;render();try{await fn()}catch(err){alert('No se pudo completar: '+err.message)}finally{S.busy=false;save();render()}}
async function newCase(){await busyTask('new',async()=>{const c=await ai('case',{priorCases:S.history.slice(-12).map(x=>x.vehicle+' '+x.topic),skills:S.skills,initialAssessment:S.firstAssessment,difficulty:S.history.length===0?'Intermedio inicial adaptable':S.history.at(-1)?.score>=85?'Progresivo avanzado':'Adaptativo',instructions:'Elige un caso coherente, seguro y resoluble. No muestres la causa al usuario.'});if(!c?.vehicle?.brand||!Array.isArray(c.tests)||!Array.isArray(c.repairs)||!c.hiddenCause)throw Error('Caso incompleto, intenta nuevamente.');S.case=c;S.tests=[];S.repairs=[];S.messages=[{role:'client',text:c.customer?.opening||c.complaint}];S.notes='';S.diagnosis='';S.evaluation=null;S.attempt=1;S.tab='client';S.page='workshop';S.started=Date.now();S.paused=0;S.firstAssessment=false;})}
async function chat(msg){if(!S.case)return;S.messages.push({role:'me',text:msg});S.clientDraft='';save();await busyTask('chat',async()=>{const c=S.case;const result=await ai('chat',{vehicle:c.vehicle,customer:c.customer,complaint:c.complaint,conditions:c.conditions,history:c.history,messages:S.messages.slice(-18),question:msg});S.messages.push({role:'client',text:result.reply||'Disculpe, ¿me puede repetir la pregunta?'});})}
async function evaluate(){if(!S.diagnosis.trim())return alert('Primero escribe tu diagnóstico y razonamiento.');await busyTask('evaluate',async()=>{const c=S.case;const repairs=(c.repairs||[]).filter(x=>S.repairs.includes(x.id));const tests=(c.tests||[]).filter(x=>S.tests.includes(x.id));const resolved=repairs.some(x=>x.correct)&&S.diagnosis.length>30;const v=await ai('evaluate',{vehicle:c.vehicle,complaint:c.complaint,hiddenCause:c.hiddenCause,conditions:c.conditions,testsAvailable:c.tests,testsPerformed:tests,repairsPerformed:repairs,diagnosis:S.diagnosis,customerQuestions:S.messages.filter(x=>x.role==='me').map(x=>x.text),attempt:S.attempt,resolved});S.evaluation={...v,passed:!!v.passed&&resolved,secondChance:!resolved&&S.attempt===1,reveal:(!resolved&&S.attempt===1)?'':v.reveal};if(!S.evaluation.passed&&S.attempt===1){S.evaluation.reveal='';S.evaluation.lesson='Revisa tus hipótesis y vuelve a comprobar evidencias antes de tu segundo intento.'}else{const score=Math.min(100,Math.max(0,Number(v.score)||0));S.history.push({vehicle:`${c.vehicle.brand} ${c.vehicle.model} ${c.vehicle.year}`,topic:c.complaint,score,date:new Date().toLocaleDateString('es-CL')});S.xp+=Math.round(score/5);const targets=c.learningTargets?.length?c.learningTargets:['Diagnóstico general'];for(const target of targets){const old=S.skills[target];S.skills[target]=old===undefined?score:Math.round(old*.7+score*.3)}}S.tab='report';})}
async function lesson(topic){S.studyTopic=topic;await busyTask('study',async()=>{S.study=await ai('study',{topic,vehicle:S.case?.vehicle||null,learningNeeds:S.skills,language:'es-CL'})})}
async function health(){try{const r=await fetch('/healthz');const j=await r.json();if($('#apiStatus'))$('#apiStatus').textContent=j.aiConfigured?'✓ Clave API configurada · Modelo '+j.model:'⚠ Falta GEMINI_API_KEY en Render'}catch{if($('#apiStatus'))$('#apiStatus').textContent='Sin conexión al servidor'}}
function exportData(){const blob=new Blob([JSON.stringify({...S,busy:false},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='thokar-academy-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){try{const data=JSON.parse(await file.text());if(!data||typeof data!=='object'||!Array.isArray(data.history)||!confirm('¿Reemplazar el progreso actual por el respaldo?'))return;S={...defaultState(),...data,busy:false};save();render()}catch{alert('El respaldo no es válido')}}
function clock(){const el=$('#clock');if(el&&S.started){const sec=Math.max(0,Math.floor((Date.now()-S.started)/1000));el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}}setInterval(clock,1000);
let sceneCleanup=null;async function init3d(){if(sceneCleanup){sceneCleanup();sceneCleanup=null}const host=$('#viewer');if(!host)return;const canvas=document.createElement('canvas');host.prepend(canvas);const ctx=canvas.getContext('2d');let angle=.5,zoom=1,drag=false,last=0;function draw(){if(!canvas.isConnected)return;const w=host.clientWidth,h=host.clientHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const cx=w/2,cy=h*.54;const project=(x,y,z)=>{const ca=Math.cos(angle),sa=Math.sin(angle);const X=x*ca-z*sa,Z=x*sa+z*ca;return [cx+X*zoom*50,cy+(Z*.43-y)*zoom*50]};const poly=(pts,fill,stroke='#101116')=>{ctx.beginPath();pts.forEach((p,i)=>{const [x,y]=project(...p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()};const box=(x1,y1,z1,x2,y2,z2,top,side,front)=>{poly([[x1,y2,z1],[x2,y2,z1],[x2,y2,z2],[x1,y2,z2]],top);poly([[x1,y1,z2],[x2,y1,z2],[x2,y2,z2],[x1,y2,z2]],side);poly([[x2,y1,z1],[x2,y1,z2],[x2,y2,z2],[x2,y2,z1]],front)};poly([[-5,-.8,-5],[5,-.8,-5],[5,-.8,5],[-5,-.8,5]],'#30343c');box(-2,.15,-1,2,.9,1,'#b93244','#861f31','#e14d5c');box(-.9,.9,-.9,1.1,1.65,.9,'#505968','#252c36','#687283');poly([[-.85,1.5,1],[1,1.5,1],[1.05,.96,1],[-.9,.96,1]],'#283743');for(const x of [-1.35,1.35])for(const z of [-1.02,1.02]){const [px,py]=project(x,.15,z);ctx.beginPath();ctx.ellipse(px,py,14*zoom,20*zoom,0,0,Math.PI*2);ctx.fillStyle='#101216';ctx.fill();ctx.strokeStyle='#777';ctx.stroke()}requestAnimationFrame(draw)};draw();host.onpointerdown=ev=>{drag=true;last=ev.clientX;host.setPointerCapture(ev.pointerId)};host.onpointermove=ev=>{if(drag){angle+=(ev.clientX-last)*.012;last=ev.clientX}};host.onpointerup=()=>drag=false;host.onwheel=ev=>{ev.preventDefault();zoom=Math.max(.55,Math.min(1.7,zoom-ev.deltaY*.001))};sceneCleanup=()=>{host.onpointerdown=null;host.onpointermove=null;host.onpointerup=null;host.onwheel=null}}
function zone(id){const z={motor:'Compartimiento del motor: inspección visual general disponible. Para resultados específicos, selecciona una prueba en la pestaña Pruebas.',ruedas:'Ruedas y suspensión: inspecciona neumáticos, componentes visibles y holguras mediante las pruebas disponibles.',interior:'Interior: revisa testigos, mandos y condiciones de operación mediante las pruebas del caso.'};if($('#zoneInfo'))$('#zoneInfo').textContent=z[id]||'Zona no disponible'}
document.addEventListener('click',async ev=>{const page=ev.target.closest('[data-page]');if(page){set({page:page.dataset.page});return}const node=ev.target.closest('[data-tab],[data-action]');if(!node)return;if(node.dataset.tab){set({tab:node.dataset.tab});return}const action=node.dataset.action;if(action==='new')return newCase();if(['home','workshop','study','progress','settings'].includes(action))return set({page:action});if(action==='health')return health();if(action==='dark'||action==='light')return set({theme:action});if(action==='export')return exportData();if(action==='evaluate')return evaluate();if(action==='retry'){S.attempt=2;S.evaluation=null;S.diagnosis='';S.tab='tests';return set({})}if(action==='askNext'){if(confirm('¿Quieres generar un nuevo caso? El caso anterior quedará registrado si completaste la evaluación.'))return newCase();return}if(action.startsWith('zone:'))return zone(action.slice(5));if(action.startsWith('test:')){const id=action.slice(5);if(!S.tests.includes(id))S.tests.push(id);return set({})}if(action.startsWith('repair:')){const id=action.slice(7);if(S.repairs.includes(id))return;const r=S.case.repairs.find(x=>x.id===id);if(!confirm(`¿Aplicar intervención: ${r?.label||id}? Se registrará como decisión de diagnóstico.`))return;S.repairs.push(id);return set({})}if(action==='meter'){const mode=$('#meterMode').value,probes=$('#meterProbes').value;$('#meterRead').textContent=mode==='vdc'&&probes==='right'?'12,6 V (valor ficticio de práctica)':mode==='vdc'?'−12,6 V (polaridad invertida)':'Selección incorrecta: utiliza V⎓ para tensión continua';return}});
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='chatForm'){const msg=$('#chatInput').value.trim();if(msg)chat(msg)}if(ev.target.id==='studyForm'){const t=$('#studyInput').value.trim();if(t)lesson(t)}});document.addEventListener('input',ev=>{if(ev.target.id==='diagnosis'){S.diagnosis=ev.target.value;save()}if(ev.target.id==='chatInput'){S.clientDraft=ev.target.value;save()}if(ev.target.id==='studyInput'){S.studyTopic=ev.target.value;save()}});document.addEventListener('change',ev=>{if(ev.target.id==='importFile'&&ev.target.files?.[0])importData(ev.target.files[0])});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});render();
</script></body></html>
